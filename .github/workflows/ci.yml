name: "Sample React CI Pipeline / Workflow"

on:
    push:
        branches:
            - main
            - master

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: "Setup Node JS"
              uses: actions/setup-node@v7
              with:
                node-version: '24'

            - name: "Check node version"
              run: node --version

            - name: "Clone the repository"
              uses: actions/checkout@v7

            - name: "install dependencies"
              run: npm install